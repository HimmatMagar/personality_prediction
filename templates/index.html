<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Personality Predictor | Introvert or Extrovert</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eef2f7 0%, #dce3ec 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .card {
            max-width: 720px;
            width: 100%;
            background: #ffffff;
            border-radius: 2rem;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            transition: all 0.2s;
        }

        .card-header {
            background: #1a2a3a;
            padding: 1.6rem 2rem;
            color: white;
        }

        .card-header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .card-header .badge {
            display: inline-block;
            background: #4a6f8f;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            margin-top: 0.5rem;
        }

        .card-header p {
            font-size: 0.9rem;
            opacity: 0.85;
            margin-top: 0.5rem;
        }

        .form-container {
            padding: 2rem 2rem 1.5rem;
        }

        .input-group {
            margin-bottom: 1.3rem;
            display: flex;
            flex-direction: column;
        }

        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 0.2rem;
        }

        .input-row .input-group {
            flex: 1;
            margin-bottom: 0;
        }

        label {
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #2c3e4e;
            margin-bottom: 0.4rem;
        }

        label .field-desc {
            font-weight: 400;
            text-transform: none;
            font-size: 0.7rem;
            color: #6c7e8f;
        }

        input,
        select {
            background: #f9fbfd;
            border: 1.5px solid #e2e8f0;
            border-radius: 1.2rem;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            font-weight: 500;
            transition: 0.2s;
            outline: none;
            color: #0f172a;
        }

        input:focus,
        select:focus {
            border-color: #5b8cbb;
            box-shadow: 0 0 0 3px rgba(79, 114, 139, 0.2);
            background: white;
        }

        .hint {
            font-size: 0.7rem;
            color: #6c7e8f;
            margin-top: 0.3rem;
            margin-left: 0.5rem;
        }

        button {
            background: #2c3e50;
            color: white;
            border: none;
            width: 100%;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 2.5rem;
            margin-top: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 12px -6px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background: #1e2f3e;
            transform: scale(0.98);
        }

        button:active {
            transform: scale(0.96);
        }

        .custom-alert {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) scale(0.96);
            background: #1e293b;
            backdrop-filter: blur(12px);
            background: rgba(20, 30, 45, 0.96);
            border-radius: 48px;
            padding: 0.85rem 2rem;
            min-width: 260px;
            text-align: center;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border-left: 6px solid #f4c542;
            letter-spacing: 0.2px;
            pointer-events: none;
        }

        .custom-alert.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) scale(1);
        }

        .custom-alert.extrovert {
            border-left-color: #2c8c5a;
            background: #1f3d32;
        }

        .custom-alert.introvert {
            border-left-color: #608bc2;
            background: #1e2f40;
        }

        .custom-alert.error-alert {
            border-left-color: #c95a5a;
            background: #3d2626;
        }

        .loader {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            padding: 0.9rem 1rem 1.2rem;
            color: #7f8c8d;
            border-top: 1px solid #eef2f6;
            background: #fefefe;
        }

        @media (max-width: 600px) {
            .form-container {
                padding: 1.5rem;
            }

            .input-row {
                flex-direction: column;
                gap: 0;
            }

            .input-row .input-group {
                margin-bottom: 1rem;
            }

            .card-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="card-header">
            <h1>Personality Compass</h1>
            <div class="badge">AI Behavior Analysis</div>
            <p>Complete the form below to determine if your traits align with Introvert or Extrovert pattern.</p>
        </div>

        <div class="form-container">
            <form id="predictionForm">
                <div class="input-group">
                    <label>TIME SPENT ALONE <span class="field-desc">(hours per day)</span></label>
                    <input type="number" step="any" id="time_spent_alone" name="time_spent_alone"
                        placeholder="e.g., 5.5" required>
                    <div class="hint">Positive number greater than 0</div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label>STAGE FEAR</label>
                        <select id="stage_fear" required>
                            <option value="" disabled selected>-- Select --</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>DRAINED AFTER SOCIALIZING</label>
                        <select id="drained_after_socializing" required>
                            <option value="" disabled selected>-- Select --</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label>SOCIAL EVENT ATTENDANCE <span class="field-desc">(events per month)</span></label>
                        <input type="number" step="any" id="social_event_attendance" placeholder="e.g., 4.0" required>
                    </div>
                    <div class="input-group">
                        <label>GOING OUTSIDE <span class="field-desc">(days per week)</span></label>
                        <input type="number" step="any" id="going_outside" placeholder="e.g., 4" required>
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label>FRIENDS CIRCLE SIZE</label>
                        <input type="number" step="any" id="friends_circle_size" placeholder="e.g., 6" required>
                    </div>
                    <div class="input-group">
                        <label>POST FREQUENCY <span class="field-desc">(posts per week)</span></label>
                        <input type="number" step="any" id="post_frequency" placeholder="e.g., 2" required>
                    </div>
                </div>

                <button type="submit" id="submitBtn">
                    <span>Analyze Personality</span>
                </button>
            </form>
        </div>
        <footer>
            Prediction reference: 1 = Extrovert , 0 = Introvert
        </footer>
    </div>

    <div id="customAlert" class="custom-alert"></div>

    <script>
        // API endpoint configuration
        // By default it uses relative path '/predict' which works if frontend is served from same origin as FastAPI
        // For cross-origin or different port, modify BASE_URL. Example: http://localhost:8000/predict
        const API_ENDPOINT = '/predict';

        // Helper to show custom alert with proper styling
        function showAlert(message, type) {
            const alertBox = document.getElementById('customAlert');
            // reset classes
            alertBox.classList.remove('extrovert', 'introvert', 'error-alert', 'show');
            // force reflow for smooth transition
            void alertBox.offsetWidth;

            alertBox.textContent = message;

            if (type === 'extrovert') {
                alertBox.classList.add('extrovert');
            } else if (type === 'introvert') {
                alertBox.classList.add('introvert');
            } else if (type === 'error') {
                alertBox.classList.add('error-alert');
            }

            alertBox.classList.add('show');

            // auto hide after 3.5 seconds
            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 3500);
        }

        // loading state management for button
        function setLoadingState(isLoading, buttonElement) {
            if (isLoading) {
                buttonElement.disabled = true;
                buttonElement.style.opacity = '0.7';
                buttonElement.innerHTML = '<span class="loader"></span> Analyzing...';
            } else {
                buttonElement.disabled = false;
                buttonElement.style.opacity = '1';
                buttonElement.innerHTML = '<span>Analyze Personality</span>';
            }
        }

        // main prediction handler
        async function handlePredictionSubmit(event) {
            event.preventDefault();

            // get all form values
            const timeSpentAloneRaw = document.getElementById('time_spent_alone').value.trim();
            const stageFearValue = document.getElementById('stage_fear').value;
            const socialEventRaw = document.getElementById('social_event_attendance').value.trim();
            const goingOutsideRaw = document.getElementById('going_outside').value.trim();
            const drainedValue = document.getElementById('drained_after_socializing').value;
            const friendsCircleRaw = document.getElementById('friends_circle_size').value.trim();
            const postFreqRaw = document.getElementById('post_frequency').value.trim();

            // validation for selects
            if (!stageFearValue || !drainedValue) {
                showAlert('Please select both Stage Fear and Drained After Socializing options.', 'error');
                return;
            }

            // parse numeric fields
            const timeSpentAlone = parseFloat(timeSpentAloneRaw);
            const socialEventAttendance = parseFloat(socialEventRaw);
            const goingOutside = parseFloat(goingOutsideRaw);
            const friendsCircleSize = parseFloat(friendsCircleRaw);
            const postFrequency = parseFloat(postFreqRaw);

            // validation for positive numbers (gt 0)
            if (isNaN(timeSpentAlone) || timeSpentAlone <= 0) {
                showAlert('Time spent alone must be a positive number greater than 0.', 'error');
                return;
            }
            if (isNaN(socialEventAttendance) || socialEventAttendance <= 0) {
                showAlert('Social event attendance must be a positive number greater than 0.', 'error');
                return;
            }
            if (isNaN(goingOutside) || goingOutside <= 0) {
                showAlert('Going outside value must be a positive number greater than 0.', 'error');
                return;
            }
            if (isNaN(friendsCircleSize) || friendsCircleSize <= 0) {
                showAlert('Friends circle size must be a positive number greater than 0.', 'error');
                return;
            }
            if (isNaN(postFrequency) || postFrequency <= 0) {
                showAlert('Post frequency must be a positive number greater than 0.', 'error');
                return;
            }

            // build payload matching UserInput schema
            const requestPayload = {
                time_spent_alone: timeSpentAlone,
                stage_fear: stageFearValue,
                social_event_attendance: socialEventAttendance,
                going_outside: goingOutside,
                drained_after_socializing: drainedValue,
                friends_circle_size: friendsCircleSize,
                post_frequency: postFrequency
            };

            const submitButton = document.getElementById('submitBtn');
            setLoadingState(true, submitButton);

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(requestPayload)
                });

                if (!response.ok) {
                    let errorDetail = `Server responded with status ${response.status}`;
                    try {
                        const errorData = await response.json();
                        if (errorData.detail) {
                            errorDetail = errorData.detail;
                        } else if (errorData.message) {
                            errorDetail = errorData.message;
                        }
                    } catch (e) {
                        // ignore parsing error, keep generic message
                    }
                    throw new Error(errorDetail);
                }

                const resultData = await response.json();
                // parse prediction value: expected format { "prediction": [0] } or { "prediction": 0 } or { "prediction": 1 }
                let predictionValue = null;
                if (resultData.prediction !== undefined) {
                    if (Array.isArray(resultData.prediction) && resultData.prediction.length > 0) {
                        predictionValue = resultData.prediction[0];
                    } else if (typeof resultData.prediction === 'number') {
                        predictionValue = resultData.prediction;
                    } else if (typeof resultData.prediction === 'string') {
                        predictionValue = parseInt(resultData.prediction, 10);
                    } else {
                        predictionValue = Number(resultData.prediction);
                    }
                } else if (resultData.result !== undefined) {
                    predictionValue = Number(resultData.result);
                } else if (typeof resultData === 'number') {
                    predictionValue = resultData;
                } else {
                    // fallback: try to find any numeric field
                    const firstNumber = Object.values(resultData).find(v => typeof v === 'number' || (typeof v === 'string' && !isNaN(parseFloat(v))));
                    if (firstNumber !== undefined) {
                        predictionValue = parseFloat(firstNumber);
                    } else {
                        throw new Error('Invalid response format: missing prediction field');
                    }
                }

                const numericPrediction = Number(predictionValue);
                let alertMessage = '';
                let alertType = '';

                if (numericPrediction === 1) {
                    alertMessage = 'RESULT: EXTROVERT (1) - High social engagement and outward energy.';
                    alertType = 'extrovert';
                } else if (numericPrediction === 0) {
                    alertMessage = 'RESULT: INTROVERT (0) - Preference for solitude and deep focus.';
                    alertType = 'introvert';
                } else {
                    alertMessage = `Unexpected prediction value: ${numericPrediction}. Expected 0 or 1.`;
                    alertType = 'error';
                }

                showAlert(alertMessage, alertType);

            } catch (error) {
                console.error('Prediction API call failed:', error);
                let userFriendlyMsg = `Prediction failed: ${error.message}`;
                if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                    userFriendlyMsg = 'Cannot connect to the prediction server. Please ensure the backend is running at ' + API_ENDPOINT + ' and CORS is configured correctly.';
                }
                showAlert(userFriendlyMsg, 'error');
            } finally {
                setLoadingState(false, submitButton);
            }
        }

        // attach submit handler to form
        const formElement = document.getElementById('predictionForm');
        formElement.addEventListener('submit', handlePredictionSubmit);

        // Optional: enforce positive numbers on input (client side friendly)
        const positiveNumberFields = ['time_spent_alone', 'social_event_attendance', 'going_outside', 'friends_circle_size', 'post_frequency'];
        positiveNumberFields.forEach(fieldId => {
            const inputField = document.getElementById(fieldId);
            if (inputField) {
                inputField.addEventListener('input', function (e) {
                    let value = this.value.trim();
                    if (value === '') return;
                    let numValue = parseFloat(value);
                    if (!isNaN(numValue) && numValue <= 0) {
                        // clear if user enters zero or negative to avoid confusion but allow them to fix
                        if (numValue === 0) {
                            this.value = '';
                        }
                        if (numValue < 0) {
                            this.value = '';
                        }
                    }
                    // also prevent entering negative sign or invalid strings partially
                    if (value.startsWith('-')) {
                        this.value = '';
                    }
                });

                // on blur, if value is invalid negative/zero, clear and add hint (no alert, just ux)
                inputField.addEventListener('blur', function () {
                    let val = parseFloat(this.value);
                    if (!isNaN(val) && val <= 0) {
                        this.value = '';
                    } else if (this.value === '0') {
                        this.value = '';
                    }
                });
            }
        });

        // small utility: make selects not empty by default but still require selection
        const selects = document.querySelectorAll('select');
        selects.forEach(select => {
            if (select.options.length > 1 && !select.value) {
                // do nothing - user must pick
            }
        });

        // optional: set initial placeholder style consistency
        const style = document.createElement('style');
        style.textContent = `
    input:invalid, select:invalid {
      border-color: #d9c5c5;
    }
  `;
        document.head.appendChild(style);
    </script>
</body>

</html>
