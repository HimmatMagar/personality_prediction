<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Personality Compass | Brief Assessment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #e9eef3 0%, #dfe4ea 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            padding: 1.5rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* main card – compact & crisp */
        .card {
            max-width: 560px;
            width: 100%;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 32px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.2), 0 1px 2px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            transition: all 0.2s ease;
            backdrop-filter: blur(0px);
        }

        .card-header {
            background: #ffffff;
            padding: 1.6rem 1.8rem 0.8rem 1.8rem;
            border-bottom: 1px solid #edeff2;
        }

        .card-header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #3c3ed4, #7173f0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.25rem;
        }

        .badge {
            display: inline-block;
            background: #eff1fa;
            color: #3c3ed4;
            font-size: 0.7rem;
            font-weight: 500;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            margin-top: 0.3rem;
        }

        .sub {
            color: #5b6e8c;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* form spacing */
        .form-scroll {
            padding: 1.6rem 1.8rem 1.8rem 1.8rem;
            background: #fff;
        }

        .input-group {
            margin-bottom: 1.3rem;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #3c4b64;
            display: block;
            margin-bottom: 0.5rem;
        }

        label .light {
            font-weight: 400;
            color: #7f8c9a;
            text-transform: none;
            font-size: 0.7rem;
        }

        input,
        .radio-wrapper {
            width: 100%;
        }

        input[type="number"] {
            width: 100%;
            padding: 0.8rem 1rem;
            font-size: 0.95rem;
            border: 1.5px solid #e2e6ed;
            border-radius: 20px;
            background: #fefefe;
            transition: all 0.2s;
            font-weight: 500;
            color: #121826;
        }

        input[type="number"]:focus {
            border-color: #7173f0;
            outline: none;
            box-shadow: 0 0 0 3px rgba(113, 115, 240, 0.2);
            background: white;
        }

        /* radio group modern */
        .radio-flex {
            display: flex;
            gap: 1.8rem;
            align-items: center;
            background: #f9fafc;
            padding: 0.6rem 1rem;
            border-radius: 48px;
            border: 1px solid #e9edf2;
        }

        .radio-opt {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .radio-opt input {
            accent-color: #5d5fef;
            width: 18px;
            height: 18px;
            margin: 0;
            cursor: pointer;
        }

        hr {
            margin: 1rem 0;
            border: none;
            border-top: 1px solid #edf0f5;
        }

        button {
            width: 100%;
            background: #5d5fef;
            border: none;
            padding: 0.9rem 0;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            border-radius: 44px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.8rem;
            box-shadow: 0 8px 18px -8px rgba(93, 95, 239, 0.4);
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background: #4a4cdb;
            transform: scale(0.98);
            box-shadow: 0 4px 12px rgba(93, 95, 239, 0.3);
        }

        button:active {
            transform: scale(0.97);
        }

        /* custom alert — toast style */
        .custom-toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) scale(0.95);
            background: #1e293b;
            backdrop-filter: blur(12px);
            background: rgba(20, 28, 38, 0.96);
            color: white;
            padding: 0.9rem 1.4rem;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 500;
            font-size: 0.95rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.05);
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0s 0.25s, transform 0.2s ease;
            pointer-events: none;
            max-width: 85vw;
            white-space: nowrap;
        }

        .custom-toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) scale(1);
            pointer-events: auto;
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0s 0s;
        }

        .toast-icon {
            font-size: 1.3rem;
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.2));
        }

        .toast-msg {
            letter-spacing: 0.2px;
            word-break: break-word;
            white-space: normal;
            max-width: 280px;
        }

        .toast-close {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 40px;
            width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            color: white;
            margin-left: 6px;
            transition: 0.1s;
            pointer-events: auto;
        }

        .toast-close:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        /* error toast variant */
        .custom-toast.error-toast {
            background: rgba(220, 53, 69, 0.96);
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 22px rgba(220, 53, 69, 0.3);
        }

        /* small helper */
        .hint-note {
            font-size: 0.7rem;
            color: #8492a6;
            margin-top: 0.25rem;
            display: block;
        }

        @media (max-width: 500px) {
            body {
                padding: 1rem;
            }

            .form-scroll {
                padding: 1.3rem;
            }

            .card-header {
                padding: 1.2rem 1.3rem 0.5rem;
            }

            .radio-flex {
                gap: 1rem;
                flex-wrap: wrap;
                border-radius: 28px;
            }

            .custom-toast {
                white-space: normal;
                width: auto;
                border-radius: 32px;
                padding: 0.8rem 1.2rem;
                bottom: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="card-header">
            <h1>personality<span style="font-weight:400">·compass</span></h1>
            <div class="badge">⚡ big5 inspired · 2 min</div>
            <div class="sub"><span>🔍</span> quick traits: introvert ↔ extravert</div>
        </div>

        <div class="form-scroll">
            <form id="predictionForm" method="post" action="http://localhost:8000/predict">
                <!-- Time spent alone -->
                <div class="input-group">
                    <label>🕒 alone time <span class="light">(hours/day, by choice)</span></label>
                    <input type="number" step="any" name="time_spent_alone" min="0" max="24" placeholder="e.g., 3.5"
                        required>
                </div>

                <!-- stage fear: radio -->
                <div class="input-group">
                    <label>🎤 stage nerves <span class="light">anxious when speaking to group?</span></label>
                    <div class="radio-flex">
                        <label class="radio-opt">
                            <input type="radio" name="stage_fear" value="yes" required> <span>Yes 😰</span>
                        </label>
                        <label class="radio-opt">
                            <input type="radio" name="stage_fear" value="no"> <span>No 😌</span>
                        </label>
                    </div>
                </div>

                <!-- social event attendance per month -->
                <div class="input-group">
                    <label>📅 social events <span class="light">(attendance per month)</span></label>
                    <input type="number" step="any" name="social_event_attendance" min="0" max="100"
                        placeholder="0 – 30+" required>
                </div>

                <!-- going outside -->
                <div class="input-group">
                    <label>🌿 going outside <span class="light">(non-essential outings, 0–100 scale)</span></label>
                    <input type="number" step="any" name="going_outside" min="0" max="100" placeholder="frequency score"
                        required>
                </div>

                <!-- drained after socializing -->
                <div class="input-group">
                    <label>⚡ emotionally drained <span class="light">after spending time with people?</span></label>
                    <div class="radio-flex">
                        <label class="radio-opt">
                            <input type="radio" name="drained_after_socializing" value="yes" required> <span>Yes, I
                                recharge alone</span>
                        </label>
                        <label class="radio-opt">
                            <input type="radio" name="drained_after_socializing" value="no"> <span>No, I gain
                                energy</span>
                        </label>
                    </div>
                </div>

                <!-- close friends circle size -->
                <div class="input-group">
                    <label>👥 close friends <span class="light">(talk regularly)</span></label>
                    <input type="number" step="any" name="friends_circle_size" min="0" placeholder="e.g., 2, 5, 12"
                        required>
                </div>

                <!-- social media post frequency -->
                <div class="input-group">
                    <label>📱 social media posts <span class="light">(posts / shares per week approx.)</span></label>
                    <input type="number" step="any" name="post_frequency" min="0" placeholder="0 = lurker, 10+ = active"
                        required>
                </div>

                <hr>
                <button type="button" id="predictBtn">✨ analyze & predict ✨</button>
                <div class="hint-note" style="text-align:center; margin-top:12px">secure · instant personality insight
                </div>
            </form>
        </div>
    </div>

    <!-- Custom alert component (toast) -->
    <div id="smartToast" class="custom-toast">
        <span class="toast-icon" id="toastIcon">🧠</span>
        <span class="toast-msg" id="toastMessage">prediction ready</span>
        <button class="toast-close" id="toastCloseBtn" aria-label="close">✕</button>
    </div>

    <script>
        (function () {
            // DOM elements
            const form = document.getElementById('predictionForm');
            const predictBtn = document.getElementById('predictBtn');
            const toastEl = document.getElementById('smartToast');
            const toastMessageSpan = document.getElementById('toastMessage');
            const toastIconSpan = document.getElementById('toastIcon');
            const toastClose = document.getElementById('toastCloseBtn');

            // helper: show custom alert (toast)
            function showAlert(message, isError = false) {
                // set message & icon style
                toastMessageSpan.innerText = message;
                if (isError) {
                    toastIconSpan.innerHTML = '⚠️';
                    toastEl.classList.add('error-toast');
                } else {
                    toastIconSpan.innerHTML = '🧠';
                    toastEl.classList.remove('error-toast');
                }
                // make visible
                toastEl.classList.add('show');

                // auto hide after 4 seconds
                clearTimeout(window.toastTimeout);
                window.toastTimeout = setTimeout(() => {
                    toastEl.classList.remove('show');
                }, 4200);
            }

            // hide on manual close
            toastClose.addEventListener('click', () => {
                toastEl.classList.remove('show');
                if (window.toastTimeout) clearTimeout(window.toastTimeout);
            });

            // Helper: collect and validate form data, return FormData or throw error
            function gatherFormData() {
                // manual extraction to ensure required radio groups are validated
                const time_spent_alone = form.querySelector('input[name="time_spent_alone"]').value.trim();
                const stage_fear_radios = form.querySelectorAll('input[name="stage_fear"]');
                let stage_fear_value = null;
                for (let radio of stage_fear_radios) {
                    if (radio.checked) {
                        stage_fear_value = radio.value;
                        break;
                    }
                }
                const social_event_attendance = form.querySelector('input[name="social_event_attendance"]').value.trim();
                const going_outside = form.querySelector('input[name="going_outside"]').value.trim();
                const drained_radios = form.querySelectorAll('input[name="drained_after_socializing"]');
                let drained_value = null;
                for (let radio of drained_radios) {
                    if (radio.checked) {
                        drained_value = radio.value;
                        break;
                    }
                }
                const friends_circle_size = form.querySelector('input[name="friends_circle_size"]').value.trim();
                const post_frequency = form.querySelector('input[name="post_frequency"]').value.trim();

                // validation: all fields required
                if (!time_spent_alone) throw new Error('Please enter hours spent alone.');
                if (stage_fear_value === null) throw new Error('Please select: nervous when speaking in front of group?');
                if (!social_event_attendance) throw new Error('Social event attendance is required.');
                if (!going_outside) throw new Error('Going outside frequency is required.');
                if (drained_value === null) throw new Error('Please answer: emotionally drained after socializing?');
                if (!friends_circle_size) throw new Error('Number of close friends is required.');
                if (!post_frequency) throw new Error('Social media post frequency is required.');

                // numeric sanitization
                const tAlone = parseFloat(time_spent_alone);
                const socialEv = parseFloat(social_event_attendance);
                const goingOut = parseFloat(going_outside);
                const friendsSize = parseFloat(friends_circle_size);
                const postFreq = parseFloat(post_frequency);

                if (isNaN(tAlone)) throw new Error('Alone time must be a number.');
                if (isNaN(socialEv)) throw new Error('Social events must be a number.');
                if (isNaN(goingOut)) throw new Error('Going outside score must be a number.');
                if (isNaN(friendsSize)) throw new Error('Friends circle must be a number.');
                if (isNaN(postFreq)) throw new Error('Post frequency must be a number.');

                // Build FormData
                const fd = new FormData();
                fd.append('time_spent_alone', tAlone);
                fd.append('stage_fear', stage_fear_value);
                fd.append('social_event_attendance', socialEv);
                fd.append('going_outside', goingOut);
                fd.append('drained_after_socializing', drained_value);
                fd.append('friends_circle_size', friendsSize);
                fd.append('post_frequency', postFreq);

                return fd;
            }

            // main prediction request to FastAPI endpoint
            async function sendPrediction() {
                let formData;
                try {
                    formData = gatherFormData();
                } catch (validationErr) {
                    showAlert(validationErr.message, true);
                    return;
                }

                // disable button during request (UX)
                const originalBtnText = predictBtn.innerHTML;
                predictBtn.innerHTML = '🔄 analyzing ...';
                predictBtn.disabled = true;

                try {
                    // FastAPI endpoint (consistent with backend)
                    const response = await fetch('http://localhost:8000/predict', {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'Accept': 'application/json',
                        }
                    });

                    // handle non-ok responses
                    if (!response.ok) {
                        let errorDetail = `Server error (${response.status})`;
                        try {
                            const errData = await response.json();
                            if (errData.detail) errorDetail = errData.detail;
                            else if (errData.message) errorDetail = errData.message;
                        } catch (e) { /* ignore json parse */ }
                        throw new Error(errorDetail);
                    }

                    const result = await response.json();
                    // expected response: { prediction: "some personality type" } or { personality: ... }
                    let predictionText = '';
                    if (result.prediction) {
                        predictionText = result.prediction;
                    } else if (result.personality) {
                        predictionText = result.personality;
                    } else if (result.result) {
                        predictionText = result.result;
                    } else {
                        predictionText = JSON.stringify(result); // fallback
                    }

                    // clean response string
                    const cleanPrediction = String(predictionText).substring(0, 120);
                    showAlert(`✨ personality insight: ${cleanPrediction} ✨`, false);

                } catch (err) {
                    console.error('Prediction API error:', err);
                    let friendlyMsg = err.message || 'Unable to reach personality service.';
                    if (friendlyMsg.includes('Failed to fetch') || friendlyMsg.includes('NetworkError')) {
                        friendlyMsg = '⚠️ Cannot connect to FastAPI backend. Make sure server is running at /predict endpoint.';
                    }
                    showAlert(friendlyMsg, true);
                } finally {
                    predictBtn.innerHTML = originalBtnText;
                    predictBtn.disabled = false;
                }
            }

            // add event listener to button
            predictBtn.addEventListener('click', (e) => {
                e.preventDefault();
                sendPrediction();
            });

            // optional: support Enter key inside any input? But we prevent default form submit to avoid page reload.
            // intercept any accidental form submit
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                sendPrediction();
            });

            // quick style: improve initial load
            // add floating subtle animation to toast init
            console.log('✨ Personality predictor ready — POST to /predict');
        })();
    </script>
</body>

</html>
