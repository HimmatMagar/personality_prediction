<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Personality Predictor | Introvert or Extrovert</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #eef2f7 0%, #d9e0e8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* main card */
        .predictor-card {
            max-width: 760px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            transition: all 0.2s;
        }

        .card-header {
            background: #1f2e3a;
            padding: 28px 32px;
            color: white;
        }

        .card-header h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .card-header .sub {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-top: 8px;
        }

        .form-body {
            padding: 28px 32px 24px;
        }

        /* form grid */
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 6px;
        }

        .form-group {
            flex: 1;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            width: 100%;
            flex: 0 0 100%;
        }

        label {
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #2c3e4e;
            margin-bottom: 6px;
        }

        .label-hint {
            font-weight: normal;
            text-transform: none;
            font-size: 0.7rem;
            color: #6c7e8f;
        }

        input,
        select {
            background: #fafcff;
            border: 1.5px solid #e2edf7;
            border-radius: 18px;
            padding: 12px 16px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: 0.2s;
            outline: none;
            color: #111827;
        }

        input:focus,
        select:focus {
            border-color: #4f7ea6;
            box-shadow: 0 0 0 3px rgba(79, 126, 166, 0.2);
            background: white;
        }

        .helper-text {
            font-size: 0.7rem;
            color: #7c8b9c;
            margin-top: 6px;
            margin-left: 12px;
        }

        .btn-predict {
            background: #1f2e3a;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 50px;
            margin-top: 16px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.1);
        }

        .btn-predict:hover {
            background: #0f212f;
            transform: scale(0.98);
        }

        .btn-predict:active {
            transform: scale(0.96);
        }

        .loader-icon {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            padding: 16px 24px 20px;
            color: #7f8c8d;
            border-top: 1px solid #edf2f7;
            background: #fefefe;
        }

        @media (max-width: 640px) {
            .form-body {
                padding: 20px;
            }

            .card-header {
                padding: 20px 24px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }

        /* SIMPLE ALERT BOX - Clean design */
        .simple-alert {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            min-width: 300px;
            max-width: 480px;
            background: #1e293b;
            border-radius: 48px;
            padding: 14px 28px;
            text-align: center;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.35);
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            border-left: 5px solid #f5b042;
            backdrop-filter: blur(8px);
            background: rgba(30, 41, 59, 0.96);
            letter-spacing: 0.3px;
            pointer-events: none;
        }

        .simple-alert.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* variant for extrovert */
        .simple-alert.alert-extrovert {
            border-left-color: #2b8c5e;
            background: rgba(27, 67, 50, 0.96);
        }

        /* variant for introvert */
        .simple-alert.alert-introvert {
            border-left-color: #5f8fc9;
            background: rgba(30, 47, 70, 0.96);
        }

        /* error style */
        .simple-alert.alert-error {
            border-left-color: #d9534f;
            background: rgba(80, 40, 40, 0.96);
        }
    </style>
</head>

<body>

    <div class="predictor-card">
        <div class="card-header">
            <h1>Personality Compass</h1>
            <div class="sub">AI-based behavioral analysis · predicts Introvert (0) or Extrovert (1)</div>
        </div>

        <div class="form-body">
            <form id="predictionForm">
                <!-- Time spent alone -->
                <div class="form-group full-width">
                    <label>TIME SPENT ALONE <span class="label-hint">(hours per day)</span></label>
                    <input type="number" step="any" id="time_spent_alone" placeholder="e.g., 5.5" required>
                    <div class="helper-text">Must be greater than 0</div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>STAGE FEAR</label>
                        <select id="stage_fear" required>
                            <option value="" disabled selected>-- select one --</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>DRAINED AFTER SOCIALIZING</label>
                        <select id="drained_after_socializing" required>
                            <option value="" disabled selected>-- select one --</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>SOCIAL EVENT ATTENDANCE <span class="label-hint">(per month)</span></label>
                        <input type="number" step="any" id="social_event_attendance" placeholder="e.g., 3.0" required>
                    </div>
                    <div class="form-group">
                        <label>GOING OUTSIDE <span class="label-hint">(days/week)</span></label>
                        <input type="number" step="any" id="going_outside" placeholder="e.g., 4" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>FRIENDS CIRCLE SIZE</label>
                        <input type="number" step="any" id="friends_circle_size" placeholder="e.g., 7" required>
                    </div>
                    <div class="form-group">
                        <label>POST FREQUENCY <span class="label-hint">(posts/week)</span></label>
                        <input type="number" step="any" id="post_frequency" placeholder="e.g., 2.5" required>
                    </div>
                </div>

                <button type="submit" class="btn-predict" id="submitBtn">
                    <span>Analyze & Predict</span>
                </button>
            </form>
        </div>
        <footer>
            Result mapping: 1 = Extrovert | 0 = Introvert
        </footer>
    </div>

    <!-- Simple alert box element -->
    <div id="resultAlert" class="simple-alert"></div>

    <script>
        // API endpoint - modify if your backend runs on different base URL
        // For local FastAPI development, default is '/predict' (relative)
        // Make sure CORS is enabled on backend or frontend is served from same origin
        const API_URL = 'http://localhost:8000/predict';

        // Helper: show simple alert box with message and type ('extrovert', 'introvert', 'error')
        function showSimpleAlert(message, type) {
            const alertEl = document.getElementById('resultAlert');
            // remove existing classes
            alertEl.classList.remove('alert-extrovert', 'alert-introvert', 'alert-error', 'show');
            // force reflow
            void alertEl.offsetWidth;

            alertEl.textContent = message;

            if (type === 'extrovert') {
                alertEl.classList.add('alert-extrovert');
            } else if (type === 'introvert') {
                alertEl.classList.add('alert-introvert');
            } else if (type === 'error') {
                alertEl.classList.add('alert-error');
            }

            alertEl.classList.add('show');

            // Auto hide after 3.5 seconds
            setTimeout(() => {
                alertEl.classList.remove('show');
            }, 3600);
        }

        // Loading state management
        function setButtonLoading(loading, button) {
            if (loading) {
                button.disabled = true;
                button.style.opacity = '0.7';
                button.innerHTML = '<span class="loader-icon"></span> Analyzing...';
            } else {
                button.disabled = false;
                button.style.opacity = '1';
                button.innerHTML = '<span>Analyze & Predict</span>';
            }
        }

        // Validate form and call API
        async function handlePrediction(event) {
            event.preventDefault();

            // Gather values
            const timeAloneRaw = document.getElementById('time_spent_alone').value.trim();
            const stageFearVal = document.getElementById('stage_fear').value;
            const socialEventRaw = document.getElementById('social_event_attendance').value.trim();
            const goingOutsideRaw = document.getElementById('going_outside').value.trim();
            const drainedVal = document.getElementById('drained_after_socializing').value;
            const friendsRaw = document.getElementById('friends_circle_size').value.trim();
            const postFreqRaw = document.getElementById('post_frequency').value.trim();

            // Select validation
            if (!stageFearVal || !drainedVal) {
                showSimpleAlert('Please select both Stage Fear and Drained After Socializing options.', 'error');
                return;
            }

            // Parse numeric values
            const timeSpentAlone = parseFloat(timeAloneRaw);
            const socialEventAttendance = parseFloat(socialEventRaw);
            const goingOutside = parseFloat(goingOutsideRaw);
            const friendsCircleSize = parseFloat(friendsRaw);
            const postFrequency = parseFloat(postFreqRaw);

            // Positive number validations (gt 0)
            if (isNaN(timeSpentAlone) || timeSpentAlone <= 0) {
                showSimpleAlert('Time spent alone must be a positive number (greater than 0).', 'error');
                return;
            }
            if (isNaN(socialEventAttendance) || socialEventAttendance <= 0) {
                showSimpleAlert('Social event attendance must be a positive number (greater than 0).', 'error');
                return;
            }
            if (isNaN(goingOutside) || goingOutside <= 0) {
                showSimpleAlert('Going outside value must be a positive number (greater than 0).', 'error');
                return;
            }
            if (isNaN(friendsCircleSize) || friendsCircleSize <= 0) {
                showSimpleAlert('Friends circle size must be a positive number (greater than 0).', 'error');
                return;
            }
            if (isNaN(postFrequency) || postFrequency <= 0) {
                showSimpleAlert('Post frequency must be a positive number (greater than 0).', 'error');
                return;
            }

            // Build payload exactly as UserInput expects
            const payload = {
                time_spent_alone: timeSpentAlone,
                stage_fear: stageFearVal,
                social_event_attendance: socialEventAttendance,
                going_outside: goingOutside,
                drained_after_socializing: drainedVal,
                friends_circle_size: friendsCircleSize,
                post_frequency: postFrequency
            };

            const submitBtn = document.getElementById('submitBtn');
            setButtonLoading(true, submitBtn);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    let errorMsg = `Server error (${response.status})`;
                    try {
                        const errData = await response.json();
                        if (errData.detail) errorMsg = errData.detail;
                        else if (errData.message) errorMsg = errData.message;
                    } catch (e) {
                        // keep default errorMsg
                    }
                    throw new Error(errorMsg);
                }

                const resultData = await response.json();

                // Extract prediction value: expected format { "prediction": [0] } or { "prediction": 0 } or { "prediction": 1 }
                let rawPrediction = null;
                if (resultData.prediction !== undefined) {
                    if (Array.isArray(resultData.prediction) && resultData.prediction.length > 0) {
                        rawPrediction = resultData.prediction[0];
                    } else if (typeof resultData.prediction === 'number') {
                        rawPrediction = resultData.prediction;
                    } else if (typeof resultData.prediction === 'string') {
                        rawPrediction = parseInt(resultData.prediction, 10);
                    } else {
                        rawPrediction = Number(resultData.prediction);
                    }
                } else if (resultData.result !== undefined) {
                    rawPrediction = Number(resultData.result);
                } else if (typeof resultData === 'number') {
                    rawPrediction = resultData;
                } else {
                    // fallback: look for first numeric field
                    const numericField = Object.values(resultData).find(v => typeof v === 'number' || (!isNaN(parseFloat(v)) && typeof v !== 'boolean'));
                    if (numericField !== undefined) {
                        rawPrediction = parseFloat(numericField);
                    } else {
                        throw new Error('API response missing prediction field');
                    }
                }

                const predictionValue = Number(rawPrediction);
                let alertMsg = '';
                let alertType = '';

                if (predictionValue === 1) {
                    alertMsg = 'RESULT: EXTROVERT (1) - High social energy and outward orientation.';
                    alertType = 'extrovert';
                } else if (predictionValue === 0) {
                    alertMsg = 'RESULT: INTROVERT (0) - Preference for solitary activities and deep focus.';
                    alertType = 'introvert';
                } else {
                    alertMsg = `Unexpected prediction value: ${predictionValue}. Expected 0 or 1.`;
                    alertType = 'error';
                }

                // Show the result in simple alert box
                showSimpleAlert(alertMsg, alertType);

            } catch (err) {
                console.error('Prediction error:', err);
                let friendlyError = `Request failed: ${err.message}`;
                if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
                    friendlyError = 'Cannot connect to the prediction server. Please check if backend is running at ' + API_URL + ' and CORS is enabled.';
                }
                showSimpleAlert(friendlyError, 'error');
            } finally {
                setButtonLoading(false, submitBtn);
            }
        }

        // Attach event listener to form
        const form = document.getElementById('predictionForm');
        form.addEventListener('submit', handlePrediction);

        // Helper: prevent negative or zero on number fields (user experience)
        const numericFields = ['time_spent_alone', 'social_event_attendance', 'going_outside', 'friends_circle_size', 'post_frequency'];
        numericFields.forEach(fieldId => {
            const field = document.getElementById(fieldId);
            if (field) {
                field.addEventListener('input', function (e) {
                    let val = this.value.trim();
                    if (val === '') return;
                    let num = parseFloat(val);
                    if (!isNaN(num) && num <= 0) {
                        // if user types zero or negative, clear field to avoid invalid submission
                        if (num === 0 || num < 0) {
                            this.value = '';
                        }
                    }
                    // disallow negative sign staying
                    if (val.startsWith('-')) {
                        this.value = '';
                    }
                });
                field.addEventListener('blur', function () {
                    let num = parseFloat(this.value);
                    if (!isNaN(num) && num <= 0) {
                        this.value = '';
                    }
                });
            }
        });

        // Set default empty state for selects, but required attribute will block invalid submission.
        // No initial prefilled values to keep user decision explicit.
    </script>
</body>

</html>
